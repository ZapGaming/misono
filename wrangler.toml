name = "misono"
main = "worker/src/index.js"
compatibility_date = "2026-07-01"

# Lets the Worker import the compiled theme + panel as strings.
rules = [{ type = "Text", globs = ["**/*.css", "**/*.html"], fallthrough = true }]

# --- KV ----------------------------------------------------------------------
# Backs the control panel's saved config. The id is just an identifier (not a
# secret), so it lives here. Recreate the namespace? Swap the id below.
[[kv_namespaces]]
binding = "MISONO_KV"
id = "cbd8ddd7721848d9af35524177dd39f0"

# --- Admin token -------------------------------------------------------------
# Required before the control panel can save. Never put the value in this file:
#   Dashboard → Worker → Settings → Variables and Secrets → add secret
#   named MISONO_TOKEN.  (CLI: `wrangler secret put MISONO_TOKEN`)
