name = "misono"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Lets the Worker import the compiled theme as a string.
rules = [{ type = "Text", globs = ["**/*.css", "**/*.html"], fallthrough = true }]

# KV: create a namespace (dashboard: Storage & Databases → KV → Create, or
# `wrangler kv namespace create MISONO_KV`) and paste its id below, then commit.
[[kv_namespaces]]
binding = "MISONO_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Admin token for the control panel's PUT /api/config.
# Dashboard: Worker → Settings → Variables → add secret MISONO_TOKEN.
# CLI: `wrangler secret put MISONO_TOKEN`. Do NOT put the value in this file.
